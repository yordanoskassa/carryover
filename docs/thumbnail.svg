<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#0e2a2a"/>
      <stop offset="55%" stop-color="#0b1620"/>
      <stop offset="100%" stop-color="#070d12"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ff5d4"/>
      <stop offset="100%" stop-color="#21c7a8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- soft halo behind the mark -->
  <circle cx="600" cy="300" r="150" fill="#2ee8c2" opacity="0.10"/>

  <!-- bridge mark -->
  <g transform="translate(600 300) scale(8) translate(-12 -11)" fill="url(#teal)">
    <rect x="1" y="16" width="22" height="2.5" rx="1"/>
    <rect x="5" y="6" width="2.5" height="10" rx="0.5"/>
    <rect x="16.5" y="6" width="2.5" height="10" rx="0.5"/>
    <rect x="4.5" y="5" width="3.5" height="1.5" rx="0.5"/>
    <rect x="16" y="5" width="3.5" height="1.5" rx="0.5"/>
    <path d="M1 8 Q6.25 14, 12 14 Q17.75 14, 23 8" stroke="url(#teal)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <line x1="8.5" y1="12.8" x2="8.5" y2="16" stroke="url(#teal)" stroke-width="1"/>
    <line x1="12" y1="14" x2="12" y2="16" stroke="url(#teal)" stroke-width="1"/>
    <line x1="15.5" y1="12.8" x2="15.5" y2="16" stroke="url(#teal)" stroke-width="1"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="540" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="118" font-weight="700" fill="#f1f5f9" letter-spacing="-2">Carryover</text>

  <!-- emotional tagline -->
  <text x="600" y="610" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="38" font-weight="500" fill="#2ee8c2" letter-spacing="6">MIGRATE WITHOUT FEAR</text>
</svg>
